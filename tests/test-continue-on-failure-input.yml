name: Test continue-on-failure input is accepted
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        env:
          MABL_API_KEY: invalid-key-for-testing
        with:
          environment-id: fake-env-id
          await-completion: 'false'
          continue-on-failure: 'true'
          rebaseline-images: 'false'
          set-static-baseline: 'false'

      - name: Assert action failed at API level (not at input parsing)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail because the API key is invalid (not because inputs were rejected)
          # This confirms continue-on-failure and other boolean inputs are parsed without error
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail at API call stage, but outcome was '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly processed all inputs and failed at API call stage"
