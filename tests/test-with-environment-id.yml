name: Test with environment-id input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        env:
          MABL_API_KEY: fake-api-key-for-testing
        with:
          environment-id: fake-env-id-67890
          rebaseline-images: false
          set-static-baseline: false
          continue-on-failure: true

      - name: Assert action ran and failed (expected with fake credentials)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail because the API key is fake.
          # We verify it ran (not skipped) and processed the environment-id input.
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action ran (outcome=$OUTCOME) as expected with environment-id and fake credentials"
