name: Test missing application-id and environment-id
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        env:
          MABL_API_KEY: invalid-key-for-testing
        with:
          # Neither application-id nor environment-id provided
          await-completion: 'false'

      - name: Assert action failed due to missing app/env id
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when neither application-id nor environment-id is set, but outcome was '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed when neither application-id nor environment-id was provided"
