name: Test no application-id or environment-id
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      MABL_API_KEY: fake-invalid-api-key-for-testing
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        # Neither application-id nor environment-id is provided

      - name: Assert action failed when no app or env id provided
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when no application-id or environment-id is set, but outcome was '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed when no application-id or environment-id was provided"
