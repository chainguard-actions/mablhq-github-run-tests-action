name: Test missing MABL_API_KEY
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action without MABL_API_KEY (expect failure)
        id: action
        uses: .
        with:
          application-id: fake-app-id
        continue-on-error: true
        env:
          MABL_API_KEY: ""

      - name: Assert action failed due to missing API key
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when MABL_API_KEY is not set, but got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when MABL_API_KEY is missing"
