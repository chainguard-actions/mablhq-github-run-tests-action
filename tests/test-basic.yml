name: Test basic usage with application-id
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          application-id: fake-application-id
          continue-on-failure: "true"
        env:
          MABL_API_KEY: fake-api-key
      - name: Assert action ran (outcome is success or failure, not skipped)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped, expected it to run"
            exit 1
          fi
          echo "PASS: action ran with outcome=$OUTCOME"
      - name: Assert mabl-deployment-id output exists (may be empty on API failure)
        env:
          DEPLOYMENT_ID: ${{ steps.action.outputs.mabl-deployment-id }}
          PLANS_RUN: ${{ steps.action.outputs.plans_run }}
          TESTS_RUN: ${{ steps.action.outputs.tests_run }}
        run: |
          echo "mabl-deployment-id: '$DEPLOYMENT_ID'"
          echo "plans_run: '$PLANS_RUN'"
          echo "tests_run: '$TESTS_RUN'"
          echo "PASS: outputs were accessible (values may be empty due to fake credentials)"
