name: Test basic usage with application-id
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          application-id: "fake-application-id"
          continue-on-failure: "true"
        env:
          MABL_API_KEY: "fake-api-key"
      - name: Assert action ran (outcome is success or failure, not skipped)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped, expected it to run"
            exit 1
          fi
          echo "PASS: action ran with outcome=$OUTCOME"
      - name: Assert outputs are present (even if empty due to no real credentials)
        env:
          PLANS_RUN: ${{ steps.action.outputs.plans_run }}
          PLANS_PASSED: ${{ steps.action.outputs.plans_passed }}
          PLANS_FAILED: ${{ steps.action.outputs.plans_failed }}
          TESTS_RUN: ${{ steps.action.outputs.tests_run }}
          TESTS_PASSED: ${{ steps.action.outputs.tests_passed }}
          TESTS_FAILED: ${{ steps.action.outputs.tests_failed }}
        run: |
          echo "plans_run: $PLANS_RUN"
          echo "plans_passed: $PLANS_PASSED"
          echo "plans_failed: $PLANS_FAILED"
          echo "tests_run: $TESTS_RUN"
          echo "tests_passed: $TESTS_PASSED"
          echo "tests_failed: $TESTS_FAILED"
          echo "PASS: output keys are accessible"
