name: Test basic usage with application-id
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      MABL_API_KEY: fake-api-key-for-testing
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          application-id: fake-application-id
          continue-on-failure: "true"
      - name: Assert action ran and produced outputs
        env:
          DEPLOYMENT_ID: ${{ steps.action.outputs.mabl-deployment-id }}
          PLANS_RUN: ${{ steps.action.outputs.plans_run }}
          PLANS_PASSED: ${{ steps.action.outputs.plans_passed }}
          PLANS_FAILED: ${{ steps.action.outputs.plans_failed }}
          TESTS_RUN: ${{ steps.action.outputs.tests_run }}
          TESTS_PASSED: ${{ steps.action.outputs.tests_passed }}
          TESTS_FAILED: ${{ steps.action.outputs.tests_failed }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          echo "mabl-deployment-id: $DEPLOYMENT_ID"
          echo "plans_run: $PLANS_RUN"
          echo "plans_passed: $PLANS_PASSED"
          echo "plans_failed: $PLANS_FAILED"
          echo "tests_run: $TESTS_RUN"
          echo "tests_passed: $TESTS_PASSED"
          echo "tests_failed: $TESTS_FAILED"
          # The action should either succeed or fail gracefully (not crash the runner)
          if [ "$OUTCOME" != "success" ] && [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: unexpected outcome '$OUTCOME' — expected 'success' or 'failure'"
            exit 1
          fi
          echo "PASS: action ran and produced a valid outcome"
