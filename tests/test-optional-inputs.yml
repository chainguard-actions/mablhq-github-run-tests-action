name: Test optional inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        env:
          MABL_API_KEY: fake-api-key-for-testing
        with:
          application-id: fake-app-id-12345
          browser-types: "chrome,firefox"
          plan-labels: "smoke,regression"
          uri: "https://example.com"
          mabl-branch: "feature-branch"
          http-headers: "X-Custom-Header:test-value"
          rebaseline-images: false
          set-static-baseline: false
          continue-on-failure: false

      - name: Assert action ran with optional inputs (expected failure with fake credentials)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail because the API key is fake.
          # We verify it ran (not skipped), meaning it accepted all optional inputs.
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action ran (outcome=$OUTCOME) with all optional inputs provided"
