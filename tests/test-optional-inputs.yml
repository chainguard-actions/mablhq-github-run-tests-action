name: Test optional inputs (app-url, mabl-branch, plan-labels, browser-types)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      MABL_API_KEY: fake-api-key
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        env:
          GITHUB_REF: refs/heads/main
          GITHUB_EVENT_NAME: push
        with:
          application-id: fake-application-id
          await-completion: 'false'
          continue-on-failure: 'true'
          app-url: 'https://example.com'
          mabl-branch: 'main'
          plan-labels: 'smoke,regression'
          browser-types: 'chrome,firefox'
          rebaseline-images: 'false'
          set-static-baseline: 'false'
      - name: Assert action ran with optional inputs (not skipped)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped, expected it to run"
            exit 1
          fi
          echo "PASS: action ran with optional inputs, outcome=$OUTCOME"
