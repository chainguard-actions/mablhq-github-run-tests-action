name: Test optional inputs accepted
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with all optional inputs and no API key (expect failure at API key check)
        id: action
        uses: .
        with:
          application-id: fake-app-id
          browser-types: 'chrome,firefox'
          plan-labels: 'smoke,regression'
          mabl-branch: 'main'
          app-url: 'https://example.com'
          api-url: 'https://api.example.com'
          http-headers: 'X-Custom-Header:value'
          rebaseline-images: 'false'
          set-static-baseline: 'false'
          continue-on-failure: 'false'
        continue-on-error: true
        env:
          MABL_API_KEY: ""

      - name: Assert action failed due to missing API key (all optional inputs were accepted)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when MABL_API_KEY is not set, but got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed at API key check after accepting all optional inputs"
