name: Test optional inputs are accepted
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        env:
          MABL_API_KEY: invalid-api-key-for-testing
        with:
          application-id: fake-application-id-for-testing
          browser-types: chrome,firefox
          plan-labels: smoke,regression
          uri: https://example.com
          mabl-branch: feature-branch
          http-headers: X-Custom-Header:test-value
          rebaseline-images: false
          set-static-baseline: false
          continue-on-failure: true

      - name: Assert action failed at API call (not at input parsing)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail because the API key is invalid (not because inputs are wrong)
          # This confirms optional inputs are parsed without error
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid API key, but outcome was '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action accepted all optional inputs and failed at API call as expected"
