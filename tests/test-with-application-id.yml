name: Test with application-id input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        env:
          MABL_API_KEY: fake-api-key-for-testing
        with:
          application-id: fake-app-id-12345
          rebaseline-images: false
          set-static-baseline: false
          continue-on-failure: false

      - name: Assert action ran and failed (expected with fake credentials)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail because the API key is fake and the mabl API
          # will reject the request. We just verify it ran (not skipped).
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action ran (outcome=$OUTCOME) as expected with fake credentials"
