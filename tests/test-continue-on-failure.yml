name: Test continue-on-failure input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with continue-on-failure and no API key (expect failure)
        id: action
        uses: .
        with:
          application-id: fake-app-id
          continue-on-failure: 'true'
        continue-on-error: true
        env:
          MABL_API_KEY: ""

      - name: Assert action still fails due to missing API key (continue-on-failure does not bypass config errors)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when MABL_API_KEY is not set, but got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed even with continue-on-failure=true when MABL_API_KEY is missing"
