name: Test usage with environment-id
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      MABL_API_KEY: fake-api-key-for-testing
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          environment-id: fake-environment-id
          continue-on-failure: "true"
      - name: Assert action ran with environment-id
        env:
          OUTCOME: ${{ steps.action.outcome }}
          DEPLOYMENT_ID: ${{ steps.action.outputs.mabl-deployment-id }}
        run: |
          echo "action outcome: $OUTCOME"
          echo "mabl-deployment-id: $DEPLOYMENT_ID"
          # The action should either succeed or fail gracefully (not crash the runner)
          if [ "$OUTCOME" != "success" ] && [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: unexpected outcome '$OUTCOME' — expected 'success' or 'failure'"
            exit 1
          fi
          echo "PASS: action ran with environment-id and produced a valid outcome"
