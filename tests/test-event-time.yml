name: Test event-time input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        env:
          MABL_API_KEY: invalid-key-for-testing
        with:
          application-id: fake-application-id
          event-time: "1700000000000"
      - name: Assert action ran with event-time input (fails gracefully on invalid key)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected with invalid API key)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
