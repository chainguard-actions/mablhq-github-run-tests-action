name: Test invalid API key with application-id
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: push
      GITHUB_REF: refs/heads/main
      GITHUB_REPOSITORY: test-org/test-repo
      GITHUB_SHA: abc1234def5678901234567890abcdef12345678
      GITHUB_ACTOR: test-actor
      GITHUB_ACTION: run
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        env:
          MABL_API_KEY: fake-invalid-api-key-for-testing
        with:
          application-id: fake-application-id-a

      - name: Assert action failed due to invalid API key
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with an invalid API key, but outcome was '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed when given an invalid API key"
