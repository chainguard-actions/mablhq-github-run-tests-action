name: Test invalid MABL_API_KEY with application-id
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with invalid API key (expect failure at API call)
        id: action
        uses: .
        with:
          application-id: fake-app-id-12345
          continue-on-failure: 'true'
        continue-on-error: true
        env:
          MABL_API_KEY: invalid-api-key-for-testing
          GITHUB_EVENT_NAME: push
          GITHUB_REF: refs/heads/main
          GITHUB_REPOSITORY: test-org/test-repo
          GITHUB_SHA: abc1234567890abcdef1234567890abcdef12345
          GITHUB_ACTOR: test-user
          GITHUB_ACTION: run-mabl-tests

      - name: Assert action failed (API call rejected invalid key)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid API key, but outcome was '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed when given an invalid API key"
