name: Test invalid MABL_API_KEY
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      MABL_API_KEY: fake-invalid-api-key-for-testing
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          application-id: fake-app-id

      - name: Assert action failed due to invalid API key
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with an invalid MABL_API_KEY, but outcome was '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed with an invalid MABL_API_KEY"
